<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اقرأ | تسجيل الدخول</title>
  <link rel="icon" type="image/jpeg" href="favicon.jpeg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <a href="#" class="logo">
        <img src="favicon.jpeg" alt="اقرأ" class="logo-icon" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">
        <span>اقرأ</span>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>أهلاً بك في منصة اقرأ</h2>
        <p>تابع ورد قراءتك اليومي وارتقِ بمعرفتك</p>
      </div>

      <div id="authAlert" class="alert"></div>

      <!-- Tab Buttons -->
      <div class="tabs">
        <button id="tabStudent" class="tab-btn active" onclick="switchTab('student')">👨‍🎓 دخول الطالب</button>
        <button id="tabLogin" class="tab-btn" onclick="switchTab('login')">🎓 دخول المعلم</button>
      </div>

      <!-- Student Login (from Naqati) -->
      <form id="studentLoginForm" onsubmit="handleStudentLogin(event)">
        <div class="form-group">
          <label for="studentSearch">اسم الطالب</label>
          <input type="text" id="studentSearch" class="form-control" placeholder="🔍 اكتب جزءاً من اسمك" oninput="renderStudentOptions()" autocomplete="off">
        </div>
        <div class="form-group">
          <select id="studentSelect" class="form-control" required size="5" style="height: auto; min-height: 150px;">
            <option value="">⏳ جاري تحميل الأسماء من نقاطي...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="studentPin">رمز الدخول</label>
          <input type="password" id="studentPin" class="form-control" placeholder="الرمز الظاهر عند القائد في نقاطي" inputmode="numeric" required autocomplete="off" style="text-align: center; font-size: 1.3rem; letter-spacing: 6px;">
        </div>
        <button type="submit" class="btn btn-primary">دخول للمنصة</button>
        <p style="text-align: center; margin-top: 12px; font-size: 0.88rem; color: var(--text-muted);">
          🔗 الحساب مرتبط بمنظومة <b>نقاطي</b> — نقاط قراءتك تُضاف لرصيدك هناك تلقائياً
        </p>
        <p id="naqatiLinkWrap" style="text-align: center; margin-top: 6px; display: none;">
          <a id="naqatiLink" href="#" target="_blank" style="font-weight: 700;">⭐ الانتقال إلى نقاطي</a>
        </p>
      </form>

      <!-- Teacher Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" style="display: none;">
        <div class="form-group">
          <label for="loginUsername">اسم المستخدم</label>
          <input type="text" id="loginUsername" class="form-control" placeholder="أدخل اسم المستخدم" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="loginPassword">كلمة المرور</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">دخول للمنصة</button>
      </form>

    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    let naqatiStudents = [];

    window.addEventListener('DOMContentLoaded', async () => {
      // دخول تلقائي عند القدوم من بوابة الطالب في نقاطي: index.html#nq=<id>&pin=<code>
      const hash = new URLSearchParams(window.location.hash.slice(1));
      const autoId = hash.get('nq');
      const autoPin = hash.get('pin');
      if (autoId && autoPin) {
        history.replaceState(null, '', window.location.pathname);
        const ok = await studentLogin(autoId, autoPin, true);
        if (ok) return;
      }

      // Redirect if already logged in
      const user = getUser();
      if (user && !autoId) {
        window.location.href = user.role === 'teacher' ? 'teacher.html' : 'student.html';
        return;
      }

      loadNaqatiStudents(autoId);
      loadLinkInfo();
    });

    async function loadLinkInfo() {
      try {
        const r = await fetch(`${API_BASE}/link-info`);
        const d = await r.json();
        if (d.naqatiUrl) {
          document.getElementById('naqatiLink').href = d.naqatiUrl + '/student.html';
          document.getElementById('naqatiLinkWrap').style.display = 'block';
        }
      } catch (e) {}
    }

    async function loadNaqatiStudents(preselectId) {
      const sel = document.getElementById('studentSelect');
      try {
        const r = await fetch(`${API_BASE}/auth/naqati-students`);
        const d = await r.json();
        if (!r.ok) throw new Error(d.error);
        naqatiStudents = d.students || [];
        renderStudentOptions();
        if (preselectId) sel.value = preselectId;
      } catch (e) {
        sel.innerHTML = `<option value="">⚠️ ${e.message || 'تعذر تحميل الأسماء'}</option>`;
      }
    }

    function normalizeAr(s) {
      return String(s || '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').toLowerCase().trim();
    }

    function renderStudentOptions() {
      const sel = document.getElementById('studentSelect');
      const q = normalizeAr(document.getElementById('studentSearch').value);
      const prev = sel.value;
      const list = naqatiStudents.filter(s => !q || normalizeAr(s.name).includes(q));
      if (!list.length) {
        sel.innerHTML = '<option value="">لا يوجد اسم مطابق</option>';
        return;
      }
      // تجميع حسب الحلقة
      const groups = {};
      list.forEach(s => { (groups[s.className || 'بدون حلقة'] = groups[s.className || 'بدون حلقة'] || []).push(s); });
      sel.innerHTML = Object.keys(groups).map(g =>
        `<optgroup label="${escapeAttr(g)}">` +
        groups[g].map(s => `<option value="${escapeAttr(s.id)}">${escapeAttr((s.avatar || '') + ' ' + s.name)}</option>`).join('') +
        '</optgroup>'
      ).join('');
      if (prev && list.some(s => s.id === prev)) sel.value = prev;
      else if (list.length === 1) sel.value = list[0].id;
    }

    function escapeAttr(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function studentLogin(studentId, passcode, silent) {
      try {
        const response = await fetch(`${API_BASE}/auth/student-login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ studentId, passcode })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'فشل تسجيل الدخول');
        setSession(data.token, data.user);
        window.location.href = 'student.html';
        return true;
      } catch (error) {
        if (!silent) showAlert('authAlert', error.message, 'danger');
        return false;
      }
    }

    function handleStudentLogin(e) {
      e.preventDefault();
      const studentId = document.getElementById('studentSelect').value;
      const pin = document.getElementById('studentPin').value.trim();
      if (!studentId) { showAlert('authAlert', 'اختر اسمك من القائمة', 'danger'); return; }
      studentLogin(studentId, pin, false);
    }

    function switchTab(tab) {
      const isStudent = tab === 'student';
      document.getElementById('authAlert').style.display = 'none';
      document.getElementById('studentLoginForm').style.display = isStudent ? 'block' : 'none';
      document.getElementById('loginForm').style.display = isStudent ? 'none' : 'block';
      document.getElementById('tabStudent').classList.toggle('active', isStudent);
      document.getElementById('tabLogin').classList.toggle('active', !isStudent);
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'فشل تسجيل الدخول');

        setSession(data.token, data.user);
        window.location.href = data.user.role === 'teacher' ? 'teacher.html' : 'student.html';
      } catch (error) {
        showAlert('authAlert', error.message, 'danger');
      }
    }
  </script>
</body>
</html>
