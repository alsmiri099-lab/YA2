<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مضمار سباق الحلقات التفاعلي للمسجد | شاشة العرض المباشر</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.5);
      --bg-dark: #070b14;
      --card-bg: rgba(15, 23, 42, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-dark);
      color: #f8fafc;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(245, 158, 11, 0.12), transparent 50%),
        radial-gradient(circle at 20% 90%, rgba(59, 130, 246, 0.08), transparent 40%),
        radial-gradient(circle at 80% 90%, rgba(16, 185, 129, 0.08), transparent 40%);
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .race-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid rgba(245, 158, 11, 0.25);
      background: rgba(11, 17, 32, 0.9);
      backdrop-filter: blur(10px);
    }

    .race-title-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .race-icon-badge {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 0 20px var(--gold-glow);
    }

    .race-titles h1 {
      font-size: 1.6rem;
      font-weight: 900;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .race-titles h1 span.gold {
      color: var(--gold);
      filter: drop-shadow(0 0 8px var(--gold));
    }

    .race-titles p {
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .race-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-race-ctrl {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 0.65rem 1.15rem;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-race-ctrl:hover {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--gold);
      transform: translateY(-2px);
    }

    /* Main Container */
    .race-main {
      flex: 1;
      padding: 2rem;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    /* Podium Row */
    .podium-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 1.5rem;
      margin-bottom: 3rem;
      min-height: 220px;
    }

    .podium-slot {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px 20px 0 0;
      text-align: center;
      padding: 1.5rem 1rem;
      width: 220px;
      transition: all 0.3s ease;
      position: relative;
    }

    .podium-slot.rank-1 {
      height: 230px;
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.25) 0%, rgba(30, 41, 59, 0.9) 100%);
      border-color: var(--gold);
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
    }

    .podium-slot.rank-2 {
      height: 190px;
      background: linear-gradient(180deg, rgba(148, 163, 184, 0.2) 0%, rgba(30, 41, 59, 0.8) 100%);
      border-color: #cbd5e1;
    }

    .podium-slot.rank-3 {
      height: 160px;
      background: linear-gradient(180deg, rgba(180, 83, 9, 0.2) 0%, rgba(30, 41, 59, 0.8) 100%);
      border-color: #d97706;
    }

    .podium-crown {
      font-size: 2.5rem;
      margin-bottom: 0.25rem;
      filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.8));
    }

    .podium-name {
      font-size: 1.25rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 0.35rem;
    }

    .podium-score {
      font-size: 1.1rem;
      font-weight: 800;
      color: #38bdf8;
    }

    /* Race Lanes */
    .track-section {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    }

    .track-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.75rem;
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .race-lanes-list {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    .track-lane {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 1.25rem;
      position: relative;
    }

    .track-lane-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .track-lane-title {
      font-size: 1.3rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .track-lane-score {
      font-size: 1.25rem;
      font-weight: 900;
      color: #fbbf24;
    }

    .track-bar-outer {
      height: 32px;
      background: rgba(7, 11, 20, 0.9);
      border-radius: 16px;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.15);
      overflow: visible;
    }

    .track-bar-fill {
      height: 100%;
      border-radius: 16px;
      transition: width 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .track-horse-rider {
      position: absolute;
      top: -24px;
      left: 0;
      transform: translateX(-50%);
      font-size: 3rem;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.7));
      animation: horseGallop 0.6s infinite alternate ease-in-out;
    }

    @keyframes horseGallop {
      from { transform: translateX(-50%) translateY(0); }
      to { transform: translateX(-50%) translateY(-8px); }
    }

    .finish-line {
      position: absolute;
      left: 12px;
      top: -6px;
      bottom: -6px;
      width: 4px;
      background: repeating-linear-gradient(0deg, #fff, #fff 6px, #000 6px, #000 12px);
      z-index: 5;
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    /* Footer Live Status */
    .race-live-footer {
      text-align: center;
      padding: 1.5rem;
      color: #64748b;
      font-size: 0.88rem;
    }

    .pulse-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #10b981;
      border-radius: 50%;
      margin-left: 6px;
      animation: pulseGreen 1.5s infinite;
    }

    @keyframes pulseGreen {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="race-topbar">
    <div class="race-title-group">
      <div class="race-icon-badge">🏇</div>
      <div class="race-titles">
        <h1>مضمار سباق الحلقات <span class="gold">المباشر للمسجد</span> ✨</h1>
        <p>التنافس الحي بين الحلقات القرآنية في نقاط الحفظ وأوراد القراءة</p>
      </div>
    </div>
    <div class="race-actions">
      <button class="btn-race-ctrl" onclick="toggleFullscreen()" id="btnFs" title="ملء الشاشة">
        <i class="fa-solid fa-expand"></i> <span>ملء الشاشة</span>
      </button>
      <button class="btn-race-ctrl" onclick="loadRaceData()" title="تحديث فوري">
        <i class="fa-solid fa-rotate"></i> <span>تحديث</span>
      </button>
      <a href="student.html" class="btn-race-ctrl" id="btnBack">
        <i class="fa-solid fa-arrow-left"></i> <span>الرجوع</span>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="race-main">

    <!-- Podium -->
    <div class="podium-container" id="podiumArea">
      <!-- Injected by JS -->
    </div>

    <!-- Race Lanes -->
    <section class="track-section">
      <div class="track-header">
        <span>🏁 الحلقات والفرق المتنافسة</span>
        <span>خط النهاية 🏆</span>
      </div>
      <div class="race-lanes-list" id="trackLanesList">
        <div style="text-align:center; padding:3rem; color:#94a3b8; font-size:1.2rem;">
          جاري تجهيز الفرسان ومضمار السباق... 🏇
        </div>
      </div>
    </section>

  </main>

  <footer class="race-live-footer">
    <span class="pulse-dot"></span>
    <span>شاشة التلفزيون المباشرة للمسجد والبروجكتر — تتحدث البيانات تلقائياً كل 15 ثانية</span>
  </footer>

  <script>
    async function loadRaceData() {
      try {
        const res = await fetch('/api/ibda/race-data');
        const data = await res.json();
        if (!data.success || !data.racers || data.racers.length === 0) return;

        renderPodium(data.racers);
        renderLanes(data.racers);
      } catch (e) {
        console.warn('Race fetch error:', e);
      }
    }

    function renderPodium(racers) {
      const area = document.getElementById('podiumArea');
      if (!area) return;

      const r1 = racers[0];
      const r2 = racers[1];
      const r3 = racers[2];

      let html = '';

      if (r2) {
        html += `
          <div class="podium-slot rank-2">
            <div class="podium-crown">🥈</div>
            <div class="podium-name">${escapeHtml(r2.name)}</div>
            <div class="podium-score">${r2.totalScore} نقطة</div>
            <div style="font-size:0.8rem; color:#94a3b8; margin-top:4px;">المركز الثاني</div>
          </div>
        `;
      }

      if (r1) {
        html += `
          <div class="podium-slot rank-1">
            <div class="podium-crown">👑 🥇</div>
            <div class="podium-name">${escapeHtml(r1.name)}</div>
            <div class="podium-score">${r1.totalScore} نقطة تميز</div>
            <div style="font-size:0.85rem; color:#fbbf24; font-weight:800; margin-top:4px;">متصدر السباق ✨</div>
          </div>
        `;
      }

      if (r3) {
        html += `
          <div class="podium-slot rank-3">
            <div class="podium-crown">🥉</div>
            <div class="podium-name">${escapeHtml(r3.name)}</div>
            <div class="podium-score">${r3.totalScore} نقطة</div>
            <div style="font-size:0.8rem; color:#94a3b8; margin-top:4px;">المركز الثالث</div>
          </div>
        `;
      }

      area.innerHTML = html;
    }

    function renderLanes(racers) {
      const list = document.getElementById('trackLanesList');
      if (!list) return;

      list.innerHTML = racers.map((r, idx) => {
        const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '🏇';
        return `
          <div class="track-lane" style="border-right: 5px solid ${r.color};">
            <div class="track-lane-info">
              <div class="track-lane-title">
                <span>${medal}</span>
                <span>${escapeHtml(r.name)}</span>
                <span style="font-size:0.88rem; color:#94a3b8; font-weight:normal;">(${r.studentsCount} طلاب)</span>
              </div>
              <div class="track-lane-score">
                <span>${r.totalScore} نقطة</span>
                <span style="font-size:0.85rem; color:#10b981; margin-right:10px;">(${r.readingPages} صفحة قراءة)</span>
              </div>
            </div>
            <div class="track-bar-outer">
              <div class="finish-line"></div>
              <div class="track-bar-fill" style="width: ${Math.max(10, r.progressPercent)}%; background: ${r.color};">
                <span class="track-horse-rider">${r.icon || '🏇'}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Auto load & polling
    loadRaceData();
    setInterval(loadRaceData, 15000);
  </script>
</body>
</html>
